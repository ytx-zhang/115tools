# golangci-lint v2 配置。
# 原则：标准默认集（gofmt / govet / staticcheck / errcheck / unused / ineffassign / misspell / revive）。
#
# 与 v2 时代的「零豁免」不同，本次放开两处纯粹为凑 lint 而伤害可读性的写法：
#   1. 允许 //nolint —— `defer f.Close()` 这种关闭失败无补救动作的调用，
#      写 5 行 defer 闭包 + 日志不如一行 nolint 诚实；
#   2. errcheck 对 io.Closer.Close / os.Remove 放行——清理型调用的错误没有可采取的行动。
# 其余问题仍然修代码，不扩大排除范围。
version: "2"

linters:
  default: standard
  settings:
    misspell:
      locale: US
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*http.Response).Body.Close
        - os.Remove
        - os.RemoveAll

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
