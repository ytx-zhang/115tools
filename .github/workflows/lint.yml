name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # 钉死版本，与本地 /root/go/bin/golangci-lint（v2.13.1）一致；action v9 用 node24 运行时。
          version: v2.13.1
