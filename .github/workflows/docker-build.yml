name: Docker 镜像构建

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      version:
        description: '版本号（如 0.1.0，不填则只用 latest）'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.0，不填则只用 latest）'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 QEMU（跨平台构建）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: 登录 GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: tags
        run: |
          BASE="ghcr.io/${{ github.repository }}"
          # 被 workflow_call 调用时 github 上下文沿用调用方：event_name 仍是 push，
          # GITHUB_REF_NAME 是调用方推送的分支名（main）。若直接取它，#v 对 "main" 无效，
          # 会打出 :main 标签而丢失版本标签（release 流程走的就是这条路径）。
          # 故优先取 inputs.version（仅 workflow_call / workflow_dispatch 有值），为空才回落到 tag 推送。
          VER="${{ inputs.version }}"
          if [ -z "$VER" ] && [ "${{ github.event_name }}" = "push" ]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "$VER" ]; then
            echo "tags=${BASE}:${VER},${BASE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${BASE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建并推送
        id: push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: 清理无标签旧版本
        run: |
          PACKAGE="${{ env.IMAGE_NAME }}"
          OWNER="${PACKAGE%%/*}"
          REPO="${PACKAGE##*/}"
          gh api "users/${OWNER}/packages/container/${REPO}/versions" --paginate \
            --jq '.[] | select(.metadata.container.tags | length == 0) | .id' \
            | while read -r version_id; do
              echo "删除旧版本: $version_id"
              gh api "users/${OWNER}/packages/container/${REPO}/versions/${version_id}" \
                --method DELETE --silent
            done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
