<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>115 Tools</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css?v=4">
  <link rel="modulepreload" href="/static/js/api.js">
  <link rel="modulepreload" href="/static/js/tasks.js">
  <!-- main.js 不带 query，与模块内部 import 解析的 URL 保持一致，避免同一模块被加载两份 -->
  <script type="module" src="/static/js/main.js"></script>
</head>
<body>
  <!-- 图标库：线框属性（fill/stroke/线宽/端点）由 CSS 的 .ic 统一继承，symbol 只留图形 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
      <symbol id="i-cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M7 4.5a1 1 0 0 1 1.5-.87l12 7a1 1 0 0 1 0 1.74l-12 7A1 1 0 0 1 7 18.5z"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
      <symbol id="i-drive" viewBox="0 0 24 24"><line x1="22" y1="12" x2="2" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
      <symbol id="i-warn" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></symbol>
      <!-- 品牌标识：登录页与侧边栏共用（原两份重复的大 SVG 合并为此一处） -->
      <symbol id="i-brand" viewBox="0 0 48 48"><path fill="#5b8dff" stroke="none" d="M33.5 38h-19A10.5 10.5 0 1 1 16 17.1 13.2 13.2 0 0 1 41 24.4 8.4 8.4 0 0 1 33.5 38z"/><path fill="#fff" stroke="none" d="M24.4 14.5l5.8 5.8h-3.6v6.2h-4.4v-6.2h-3.6z"/></symbol>
    </defs>
  </svg>

  <div id="login" class="login-wrap" hidden>
    <form id="login-form" name="login" class="login-card">
      <svg class="brand-logo"><use href="#i-brand"/></svg>
      <h1>115 Tools</h1>
      <p class="muted">网盘与本地媒体库的双向桥梁</p>
      <input name="username" placeholder="账号" autocomplete="username" required>
      <input name="password" type="password" placeholder="密码" autocomplete="current-password" required>
      <button type="submit" class="btn primary block">登 录</button>
    </form>
  </div>

  <div id="app-view" class="layout" hidden>
    <aside class="sidebar">
      <div class="brand">
        <svg class="brand-logo"><use href="#i-brand"/></svg>
        <span class="brand-text">115 Tools</span>
        <span class="brand-ver"></span>
      </div>
      <nav id="nav">
        <button class="nav-item active" data-view="tasks"><svg class="ic"><use href="#i-grid"/></svg><span>任务中心</span></button>
        <button class="nav-item" data-view="offline"><svg class="ic"><use href="#i-download"/></svg><span>离线下载</span></button>
        <button class="nav-item" data-view="cache"><svg class="ic"><use href="#i-folder"/></svg><span>本地缓存</span></button>
        <button class="nav-item" data-view="settings"><svg class="ic"><use href="#i-cog"/></svg><span>设置</span></button>
      </nav>
      <div class="sidebar-foot">
        <button id="logout-btn" class="nav-item" hidden><svg class="ic"><use href="#i-logout"/></svg><span>退出登录</span></button>
      </div>
    </aside>

    <main class="content">
      <section id="view-tasks" class="view">
        <div class="view-head">
          <h2><svg class="ic"><use href="#i-grid"/></svg>任务中心</h2>
          <button class="btn primary" id="task-new"><svg class="ic"><use href="#i-plus"/></svg>新建任务</button>
        </div>
        <div id="banners" class="banners"></div>
        <div id="task-grid" class="task-grid"></div>
        <div id="task-empty" class="empty-card" hidden>
          <p class="empty-title">还没有同步任务</p>
          <p class="muted">绑定一对本地目录与云端目录，即可开启自动同步</p>
          <button class="btn primary" id="empty-new"><svg class="ic"><use href="#i-plus"/></svg>新建任务</button>
        </div>
        <div class="card">
          <div class="card-head">
            <h3>最近日志</h3>
            <div class="row">
              <button class="btn sm" id="activity-refresh"><svg class="ic"><use href="#i-refresh"/></svg>刷新</button>
              <button class="btn sm danger" id="activity-clear">清空</button>
            </div>
          </div>
          <div id="activity-list" class="list"></div>
        </div>
        <!-- 警告/错误提醒：有未读时显示并闪烁，点击打开日志弹窗 -->
        <button id="log-alert" class="log-alert" hidden title="查看警告与错误">
          <svg class="ic"><use href="#i-warn"/></svg>
          <span id="log-unread" class="log-alert-badge">0</span>
        </button>
      </section>

      <section id="view-offline" class="view" hidden>
        <div class="view-head">
          <h2><svg class="ic"><use href="#i-download"/></svg>离线下载 <small class="muted" id="offline-quota"></small></h2>
        </div>
        <form id="offline-add-form" name="offline-add" class="card">
          <div class="card-head"><h3>新建离线任务</h3></div>
          <div class="form-grid">
            <label class="col-2">下载链接 <small class="muted">每行一条，支持 http / magnet / ed2k</small>
              <textarea id="offline-urls" name="urls" rows="3" placeholder="magnet:?xt=urn:btih:..."></textarea>
            </label>
            <label>种子文件（.torrent） <small class="muted">上传 .torrent，与链接二选一</small>
              <input id="offline-torrent" type="file" name="torrent" accept=".torrent">
            </label>
            <label>保存到云端目录 <small class="muted">留空默认云端根 /</small>
              <input id="offline-save-path" name="save_path" placeholder="/影视/下载">
            </label>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn primary"><svg class="ic"><use href="#i-plus"/></svg>添加任务</button>
          </div>
        </form>
        <div class="card">
          <div class="card-head">
            <h3>任务列表</h3>
            <div class="row">
              <button class="btn sm" id="offline-refresh"><svg class="ic"><use href="#i-refresh"/></svg>刷新</button>
              <button class="btn sm" data-clear="0">清除已完成</button>
              <button class="btn sm" data-clear="2">清除失败</button>
              <button class="btn sm danger" data-clear="1">清空全部</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>名称</th><th>大小</th><th>进度</th><th>状态</th><th class="ta-r">操作</th></tr></thead>
              <tbody id="offline-tbody"></tbody>
            </table>
          </div>
          <div class="row pager">
            <button class="btn sm" id="page-prev">上一页</button>
            <span id="page-info" class="muted"></span>
            <button class="btn sm" id="page-next">下一页</button>
          </div>
        </div>
      </section>

      <section id="view-cache" class="view" hidden>
        <div class="view-head">
          <h2><svg class="ic"><use href="#i-folder"/></svg>本地缓存 <small class="muted" id="cache-summary"></small></h2>
        </div>
        <div class="card">
          <div class="card-head">
            <h3>缓存列表</h3>
            <div class="row">
              <button class="btn sm" id="cache-refresh"><svg class="ic"><use href="#i-refresh"/></svg>刷新</button>
              <button class="btn sm danger" id="cache-delete-selected" disabled>删除选中</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th style="width:40px"><input type="checkbox" id="cache-check-all"></th><th>文件名</th><th>大小</th><th>过期时间</th></tr></thead>
              <tbody id="cache-tbody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="view-settings" class="view" hidden>
        <div class="view-head"><h2><svg class="ic"><use href="#i-cog"/></svg>设置</h2></div>
        <form id="config-form" name="config" class="config-form">
          <fieldset>
            <legend>账号凭证 <small class="muted">保存后重建任务</small></legend>
            <div class="form-grid">
              <label class="col-2"><span class="req">*</span> refresh_token <small class="muted">115 开放平台刷新令牌，换取访问令牌</small>
                <input name="refresh_token" type="password" autocomplete="off">
              </label>
            </div>
          </fieldset>
          <fieldset>
            <legend>同步配置 <small class="muted">* 为必填项，缺一同步不会启动</small></legend>
            <div class="form-grid">
              <label><span class="req">*</span> strm_url <small class="muted">STRM 链接前缀（/download 直链地址）</small>
                <input name="strm_url" placeholder="http://设备IP:端口号">
              </label>
              <label><span class="req">*</span> temp_dir <small class="muted">云端回收目录（清理视频时移入，可找回）</small>
                <input name="temp_dir" placeholder="/Temp">
              </label>
              <label><span class="req">*</span> cache_dir <small class="muted">本地透传缓存目录（上传视频暂存，命中直读）</small>
                <input name="cache_dir" placeholder="/mnt/cache">
              </label>
              <label>缓存保留天数 <small class="muted">本地缓存视频保留 N 天；0=默认1</small>
                <input name="cache_retention_days" type="number" min="0">
              </label>
              <label class="col-2">离线下载默认目录 <small class="muted">离线任务保存目录，留空默认云端根 /</small>
                <input name="offline_dir" placeholder="/影视/下载">
              </label>
            </div>
          </fieldset>
          <fieldset>
            <legend>视频文件扩展名</legend>
            <div class="form-grid">
              <label class="col-2">扩展名 <small class="muted">逗号分隔，如 .mp4, .mkv</small>
                <input name="video_exts" placeholder=".mp4, .mkv, ...">
              </label>
            </div>
          </fieldset>
          <fieldset>
            <legend>上传排除</legend>
            <div class="form-grid">
              <label class="col-2">后缀 <small class="muted">逗号分隔，如 .part, .crdownload, .DS_Store</small>
                <input name="upload_exclude" placeholder=".part, .crdownload, ...">
              </label>
            </div>
          </fieldset>
          <fieldset>
            <legend>登录验证 <small class="muted">用户名留空则关闭验证</small></legend>
            <div class="form-grid">
              <label>用户名<input name="auth_username" autocomplete="off"></label>
              <label>密码 <small class="muted">设置用户名后必填</small>
                <input name="auth_password" type="password" placeholder="留空则保持不变" autocomplete="new-password">
              </label>
            </div>
          </fieldset>
          <div class="form-actions">
            <button type="submit" class="btn primary">保存配置</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <!-- 任务编辑弹窗 -->
  <dialog id="task-dialog">
    <form method="dialog" id="task-form">
      <div class="dlg-head">
        <h3 id="task-dialog-title">新建任务</h3>
        <button type="button" class="btn ghost icon-only" data-close="task-dialog"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div class="dlg-body">
        <!-- 场景预设（仅新建时显示）：快速填充下方开关，填充后本区域自动隐藏 -->
        <fieldset id="preset-box">
          <legend>我要做什么</legend>
          <div class="preset-grid">
            <button type="button" class="preset-card" data-preset="push"><svg class="ic big"><use href="#i-up"/></svg><b>把媒体库搬到 115</b><small>本地视频上传，换成本地 .strm</small></button>
            <button type="button" class="preset-card" data-preset="pull"><svg class="ic big"><use href="#i-download"/></svg><b>把 115 的片拉回本地</b><small>云端新增落地为 .strm，然后归档</small></button>
            <button type="button" class="preset-card" data-preset="both"><svg class="ic big"><use href="#i-grid"/></svg><b>双向镜像</b><small>上传 + 下载都开，保持两边一致</small></button>
          </div>
        </fieldset>
        <fieldset>
          <legend>基础信息</legend>
          <div class="form-grid">
            <label class="col-2">任务名<input name="name" required placeholder="如：媒体库"></label>
            <label class="col-2 chk"><input type="checkbox" name="enabled" checked> 启用任务</label>
            <label class="col-2">本地目录 <small class="muted">容器内绝对路径</small>
              <span class="path-row">
                <input name="local_dir" placeholder="/媒体库" required>
                <button type="button" class="btn sm" id="browse-local"><svg class="ic"><use href="#i-folder"/></svg>浏览</button>
              </span>
            </label>
            <label class="col-2">云端目录 <small class="muted">115 网盘绝对路径，以 / 开头</small>
              <input name="cloud_dir" placeholder="/媒体库" required>
            </label>
          </div>
        </fieldset>
        <details class="adv" open>
          <summary>高级选项</summary>
          <div class="adv-group" id="adv-up">
            <div class="adv-title">本地 → 云端</div>
            <div class="form-grid">
              <label class="chk"><input type="checkbox" name="upload" checked> 上传本地新增/变更到云端</label>
              <div class="opt-inline">
                <label class="chk"><input type="checkbox" name="watch" checked> 文件事件监听</label>
                <span class="opt-trail">
                  <small class="muted" id="hint-quiet">分 · 0=默认10</small>
                  <input name="quiet_minutes" type="number" min="0" aria-label="文件事件监听静默时长（分钟）" aria-describedby="hint-quiet">
                </span>
              </div>
              <label class="chk"><input type="checkbox" name="instant_now" checked> 视频/STRM 文件立即同步 <small class="muted">视频与 .strm 事件绕过静默窗口</small></label>
              <label class="chk"><input type="checkbox" name="to_strm" checked> 上传后落地为 STRM <small class="muted">关=上传后本地保留实体视频</small></label>
              <label class="chk"><input type="checkbox" name="to_cache" checked> 上传后原件移入缓存 <small class="muted">关=删除原视频</small></label>
            </div>
          </div>
          <div class="adv-group" id="adv-down">
            <div class="adv-title">云端 → 本地</div>
            <div class="form-grid">
              <label class="chk"><input type="checkbox" name="download"> 下载云端缺失文件</label>
              <label class="chk"><input type="checkbox" name="to_strm_dl"> 下载落地为 STRM <small class="muted">关=下载实体视频</small></label>
              <label class="chk" id="opt-archive"><input type="checkbox" name="archive"> 完成后归档到回收目录</label>
            </div>
          </div>
          <div class="adv-group">
            <div class="adv-title">定时执行</div>
            <div class="form-grid">
              <div class="opt-inline">
                <label class="chk"><input type="checkbox" name="cron_enabled" checked> 定时执行</label>
                <span class="opt-trail">
                  <small class="muted" id="hint-cron">小时 · 0=默认12</small>
                  <input name="cron_interval_hours" type="number" min="0" aria-label="定时执行间隔（小时）" aria-describedby="hint-cron">
                </span>
              </div>
            </div>
          </div>
        </details>
      </div>
      <div class="form-actions dlg-foot">
        <button type="button" class="btn ghost" data-close="task-dialog">取消</button>
        <button type="submit" class="btn primary" id="task-save">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="dryrun-dialog">
    <div class="dlg-head">
      <h3 id="dryrun-title">预览</h3>
      <button type="button" class="btn ghost icon-only" data-close="dryrun-dialog"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="dlg-body">
      <div id="dryrun-groups" class="row wrap"></div>
      <div id="dryrun-list" class="log-box"></div>
    </div>
    <div class="form-actions dlg-foot">
      <button type="button" class="btn ghost" data-close="dryrun-dialog">关闭</button>
      <button type="button" class="btn primary" id="dryrun-run">确认执行</button>
    </div>
  </dialog>

  <dialog id="history-dialog">
    <div class="dlg-head">
      <h3 id="history-dialog-title">执行日志</h3>
      <button type="button" class="btn ghost icon-only" data-close="history-dialog"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="dlg-body"><div id="history-list" class="list"></div></div>
    <div class="form-actions dlg-foot">
      <button type="button" class="btn sm danger" id="history-clear">清空该任务日志</button>
      <button type="button" class="btn primary" data-close="history-dialog">关闭</button>
    </div>
  </dialog>

  <dialog id="log-dialog">
    <div class="dlg-head">
      <h3>警告与错误</h3>
      <button type="button" class="btn ghost icon-only" data-close="log-dialog"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="dlg-body"><div id="log-list" class="list"></div></div>
    <div class="form-actions dlg-foot">
      <button type="button" class="btn sm danger" id="log-clear"><svg class="ic"><use href="#i-trash"/></svg>清空</button>
      <button type="button" class="btn primary" data-close="log-dialog">关闭</button>
    </div>
  </dialog>

  <dialog id="fs-dialog">
    <div class="dlg-head">
      <h3>选择目录</h3>
      <button type="button" class="btn ghost icon-only" data-close="fs-dialog"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="dlg-body">
      <div class="row between">
        <code id="fs-path" class="muted">/</code>
        <button type="button" class="btn sm" id="fs-up">上一级</button>
      </div>
      <div id="fs-list" class="fs-list"></div>
    </div>
    <div class="form-actions dlg-foot">
      <button type="button" class="btn ghost" data-close="fs-dialog">取消</button>
      <button type="button" class="btn primary" id="fs-pick">选择当前目录</button>
    </div>
  </dialog>

  <!-- 行骨架：结构声明在此，JS 只 cloneNode + textContent 填值（天然防 XSS） -->
  <template id="tpl-task-card">
    <div class="task-card">
      <div class="tc-head">
        <div class="tc-name"></div>
        <span class="badge k-badge"></span>
        <label class="switch"><input type="checkbox" data-toggle><i></i></label>
      </div>
      <div class="tc-dirs">
        <span><svg class="ic"><use href="#i-drive"/></svg><span class="local"></span></span>
        <span><svg class="ic"><use href="#i-cloud"/></svg><span class="cloud"></span></span>
      </div>
      <div class="tc-status">
        <span class="badge"></span>
        <div class="progress"><i></i></div>
        <span class="tc-nums"></span>
        <div class="tc-cur"></div>
      </div>
      <div class="tc-meta"></div>
      <div class="tc-actions">
        <button class="btn sm" data-action="start"><svg class="ic"><use/></svg><span></span></button>
        <button class="btn sm" data-action="dryrun">预览</button>
        <button class="btn sm" data-action="history">日志</button>
        <button class="btn sm" data-action="edit">编辑</button>
        <button class="btn sm danger" data-action="delete">删除</button>
      </div>
    </div>
  </template>

  <!-- 通用行：日志行 / 预览动作行 共用（左标签 + 时间 + 文本 + 可选属性） -->
  <template id="tpl-line">
    <div class="log-line"><span class="lv"></span><span class="t"></span><span class="msg"></span><span class="attrs"></span></div>
  </template>

  <template id="tpl-act-row">
    <div class="hist-row">
      <span class="badge"></span><span class="badge trig"></span><span class="hr-time"></span><span class="hr-stats"></span>
      <div class="log-line lv-error err" hidden></div>
    </div>
  </template>

  <template id="tpl-offline-row">
    <tr>
      <td class="c-name"></td><td class="c-size"></td>
      <td><div class="progress"><i></i></div><span class="muted pct"></span></td>
      <td><span class="badge"></span></td>
      <td class="ta-r">
        <button class="btn sm" data-act="del">删除</button>
        <button class="btn sm danger" data-act="delFiles">删除+源文件</button>
      </td>
    </tr>
  </template>

  <template id="tpl-cache-row">
    <tr>
      <td><input type="checkbox" class="cache-check"></td>
      <td><div class="c-name"></div><div class="muted c-pc"></div></td>
      <td class="c-size"></td><td class="c-exp"></td>
    </tr>
  </template>

  <template id="tpl-fs-row"><button class="fs-row"></button></template>

  <div id="toast-box"></div>
</body>
</html>
